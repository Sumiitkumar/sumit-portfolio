name: Dagger CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  dagger-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dagger CLI
        run: |
          cd /tmp
          wget https://dl.dagger.io/dagger/releases/dagger_v0.9.3_linux_amd64.tar.gz
          tar xzf dagger_v0.9.3_linux_amd64.tar.gz
          sudo mv dagger /usr/local/bin/

      - name: Run Dagger build
        run: |
          dagger call build

      - name: Run Dagger test
        run: |
          dagger call test

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dagger-build
          path: build/
          retention-days: 30
