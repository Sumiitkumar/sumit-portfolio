# GitHub Actions workflow to build with Dagger and deploy to GitHub Pages
# Also builds and pushes a Docker image

name: Dagger CI/CD & GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dagger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dagger CLI
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | sh
          sudo mv ./bin/dagger /usr/local/bin/

      - name: Install dependencies
        run: |
          cd sumit-portfolio
          npm ci

      - name: Run Dagger pipeline (build & save Docker image as tar)
        run: |
          IMAGE="sumit-portfolio:latest"
          docker pull registry.dagger.io/engine:v0.19.11 || true
          dagger run -- bash -c '
            cd sumit-portfolio
            npm ci
            npm run build
            cd ..
            docker build -t $IMAGE ./sumit-portfolio
            docker save $IMAGE -o sumit-portfolio-image.tar
          '
