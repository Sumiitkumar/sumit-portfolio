# GitHub Actions workflow to build with Dagger and deploy to GitHub Pages
# Also builds and pushes a Docker image

name: Dagger CI/CD & GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dagger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dagger CLI
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | sh
          sudo mv ~/.dagger/bin/dagger /usr/local/bin/

      - name: Install dependencies
        run: |
          cd sumit-portfolio
          npm ci

      - name: Run Dagger pipeline (build & push Docker image)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io
          IMAGE: ghcr.io/${{ github.repository_owner }}/sumit-portfolio:latest
        run: |
          dagger run -- bash -c '
            cd sumit-portfolio
            npm ci
            npm run build
            cd ..
            docker build -t $IMAGE ./sumit-portfolio
            echo $GITHUB_TOKEN | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
            docker push $IMAGE
          '
